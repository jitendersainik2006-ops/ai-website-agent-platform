<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:Arial,sans-serif}#box{height:100vh;border:1px solid #bfd0d8;border-radius:8px;display:flex;flex-direction:column;background:#fff;overflow:hidden}header{background:#102f46;color:#fff;padding:15px;display:flex;justify-content:space-between}#messages{flex:1;overflow:auto;padding:12px;background:#f5f8f9}.msg{max-width:85%;padding:9px;margin:8px 0;border-radius:8px;white-space:pre-wrap}.agent{background:#e2f4f1}.visitor{background:#102f46;color:white;margin-left:auto}form{padding:10px;border-top:1px solid #dbe3e6;display:flex;gap:6px}input,select{flex:1;padding:10px;border:1px solid #abc0ca;border-radius:5px;box-sizing:border-box}button{border:0;background:#087f76;color:white;border-radius:5px;padding:10px;cursor:pointer}button.secondary{background:#31586b}button.danger{background:#a43d3d}#tools,#management-tools{padding:0 10px 10px;display:flex;gap:6px;flex-wrap:wrap}.appointment-panel{padding:10px;border-top:1px solid #dbe3e6;background:#fff}.appointment-panel form{padding:0;border:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}.appointment-panel input,.appointment-panel select{width:100%}.appointment-panel button{grid-column:span 2}.appointment-panel .full{grid-column:span 2}.status{margin:0 10px 10px;color:#24566c;font-size:13px}.status.error{color:#9a2828}small{color:#bcd8d8}</style></head><body><div id="box"><header><span id="title">Assistant</span><button id="close" aria-label="Close assistant">×</button></header><div id="messages"></div><p id="appointment-status" class="status" aria-live="polite"></p><div id="tools"><button id="slots" type="button">Find times</button><button id="book" type="button">Book appointment</button><button id="lead" class="secondary" type="button">Request contact</button></div><section id="appointment-panel" class="appointment-panel" hidden><form id="appointment-form"><input id="appointment-date" class="full" type="date" required><select id="appointment-slot" class="full" required><option value="">Choose a time</option></select><input id="appointment-name" placeholder="Your name" required><input id="appointment-email" type="email" placeholder="Email address" required><input id="appointment-phone" class="full" type="tel" placeholder="Phone (optional)"><button id="appointment-submit" type="submit">Confirm appointment</button></form></section><div id="management-tools" hidden><button id="reschedule" class="secondary" type="button">Reschedule</button><button id="cancel-appointment" class="danger" type="button">Cancel appointment</button></div><form id="form"><input id="input" placeholder="Ask a question..." maxlength="4000"><button>Send</button></form></div><script src="/frontend/widget/widget.js"></script></body></html>
