<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}
:root{--bg:#0d1219;--surface:#141b25;--line:#2a3645;--text:#f1f5f7;--muted:#9aa8b6;--accent:#79d9c8;--ink:#09221f;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{background:transparent;margin:0;min-width:300px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#box{background:var(--bg);border:1px solid #334151;border-radius:14px;box-shadow:0 24px 60px #0008;display:flex;flex-direction:column;height:100vh;overflow:hidden}.header{align-items:center;background:linear-gradient(130deg,#182632,#111821);border-bottom:1px solid var(--line);display:flex;gap:10px;padding:15px}.avatar{align-items:center;background:var(--accent);border-radius:8px;color:var(--ink);display:flex;font-size:12px;font-weight:900;height:31px;justify-content:center;width:31px}.title-wrap{display:grid;gap:2px;min-width:0}.title-wrap strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title-wrap span{align-items:center;color:var(--muted);display:flex;font-size:10px;gap:5px}.online{background:var(--accent);border-radius:50%;display:inline-block;height:6px;width:6px}.close{background:transparent;border:0;color:var(--muted);font-size:20px;line-height:1;margin-left:auto;padding:4px}.close:hover{color:var(--text)}#messages{background:radial-gradient(circle at 100% 0,#19323055,transparent 34%),#0d1219;display:flex;flex:1;flex-direction:column;gap:10px;overflow:auto;padding:16px}.msg{border:1px solid transparent;border-radius:10px;font-size:13px;line-height:1.55;max-width:87%;padding:10px 12px;white-space:pre-wrap}.agent{align-self:flex-start;background:#172522;border-color:#294842;color:#e6f4f1}.visitor{align-self:flex-end;background:#1b2938;border-color:#33455a;color:#f4f7fa}.typing{align-items:center;color:var(--muted);display:flex;font-size:11px;gap:7px;padding:4px}.typing i{animation:pulse 1.1s infinite;background:var(--accent);border-radius:50%;display:inline-block;height:5px;width:5px}@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}#appointment-status{color:#a6e7dc;font-size:11px;line-height:1.4;margin:0;padding:0 16px 8px}.status.error{color:#ffaaaa}.tool-row{background:#101720;display:flex;gap:7px;overflow:auto;padding:10px 12px}.tool-row button,.manage-row button{background:#172633;border:1px solid #33495a;border-radius:6px;color:#dcecf0;font-size:11px;font-weight:700;padding:8px 10px;white-space:nowrap}.tool-row button:hover,.manage-row button:hover{background:#243b4c}.tool-row .primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}.appointment-panel{background:#101720;border-top:1px solid var(--line);padding:13px}.appointment-panel form{display:grid;gap:8px;grid-template-columns:1fr 1fr}.appointment-panel .full,.appointment-panel button{grid-column:span 2}input,select{background:#0c1118;border:1px solid #354354;border-radius:6px;color:var(--text);min-height:37px;padding:8px;width:100%}.appointment-panel button{background:var(--accent);border:0;border-radius:6px;color:var(--ink);font-size:12px;font-weight:800;min-height:39px}.manage-row{background:#101720;display:flex;gap:8px;padding:0 12px 11px}.manage-row .danger{background:#3a2129;border-color:#713944;color:#ffb5bc}.composer{background:#101720;border-top:1px solid var(--line);display:flex;gap:8px;padding:12px}.composer input{flex:1}.composer button{background:var(--accent);border:0;border-radius:6px;color:var(--ink);font-size:12px;font-weight:800;min-width:58px}.composer button:disabled{opacity:.6}@media(max-width:480px){#box{border-radius:0;border:0}.msg{max-width:90%}}
</style></head><body><div id="box"><header class="header"><div class="avatar">AI</div><div class="title-wrap"><strong id="title">Website Assistant</strong><span><i class="online"></i>Secure agent online</span></div><button id="close" class="close" type="button" aria-label="Close assistant">×</button></header><div id="messages" aria-live="polite"></div><p id="appointment-status" class="status" aria-live="polite"></p><div id="tools" class="tool-row"><button id="slots" type="button">Find times</button><button id="book" class="primary" type="button">Book a meeting</button><button id="lead" type="button">Request contact</button></div><section id="appointment-panel" class="appointment-panel" hidden><form id="appointment-form"><input id="appointment-date" class="full" type="date" aria-label="Appointment date" required><select id="appointment-slot" class="full" aria-label="Available appointment time" required><option value="">Choose a time</option></select><input id="appointment-name" placeholder="Your name" aria-label="Your name" required><input id="appointment-email" type="email" placeholder="Work email" aria-label="Work email" required><input id="appointment-phone" class="full" type="tel" placeholder="Phone (optional)" aria-label="Phone"><button id="appointment-submit" type="submit">Confirm appointment</button></form></section><div id="management-tools" class="manage-row" hidden><button id="reschedule" type="button">Reschedule</button><button id="cancel-appointment" class="danger" type="button">Cancel appointment</button></div><form id="form" class="composer"><input id="input" placeholder="Ask a question..." maxlength="4000" aria-label="Message"><button id="send" type="submit">Send</button></form></div><script src="/frontend/widget/widget.js"></script></body></html>
